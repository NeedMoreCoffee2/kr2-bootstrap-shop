<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Учебный интернет-магазин">
  <meta property="og:description" content="Учебный frontend-проект интернет-магазина.">
  <meta property="og:image" content="https://needmorecoffee2.github.io/kr2-bootstrap-shop/images/preview.jpg">
  <title>Оформление заявки</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/custom.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg bg-primary">
      <div class="container">
        <a class="navbar-brand text-light" href="index.html">Bootstrap Shop</a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNavbar"
          aria-controls="mainNavbar"
          aria-expanded="false"
          aria-label="Переключить навигацию"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="index.html">
                Главная
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="catalog.html">Каталог</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contacts.html">Контакты</a>
            </li>
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Дополнительно
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="order.html">Оформить заявку</a></li>
                <li><a class="dropdown-item" href="index.html#popular">Популярные товары</a></li>
                <li><a class="dropdown-item" href="index.html#advantages">Преимущества</a></li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <nav class="container mt-4" aria-label="breadcrumb">
      <ul class="breadcrumb">
        <li class="breadcrumb-item"><a href="index.html">Главная</a></li>
        <li class="breadcrumb-item"><a href="contacts.html">Контакты</a></li>
        <li class="breadcrumb-item active" aria-current="page">Форма заявки</a></li>
      </ul>
    </nav>

    <section class="container my-4 d-flex flex-column align-items-center">
      <h2 class="fw-bold display-7 mb-4">Оформление заявки</h2>

      <form class="d-flex flex-column" action="#" method="post" novalidate>
        <div class="d-flex flex-column mb-3">
          <label class="form-label" for="order-name">Имя</label>
          <input
          class="form-control"
          id="order-name"
          name="name"
          type="text"
          placeholder="Введите ваше имя"
          minlength="2"
          autocomplete="given-name"
          required
          >
        </div>

        <div class="d-flex flex-column mb-3">
          <label class="form-label" for="order-email">E-mail</label>
          <input
          class="form-control"
          id="order-email"
          name="email"
          type="email"
          placeholder="example@mail.ru"
          autocomplete="email"
          required
          >
        </div>

        <div class="d-flex flex-column mb-3">
          <label class="form-label" for="order-phone">Телефон</label>
          <input
          class="form-control"
          id="order-phone"
          name="phone"
          type="tel"
          inputmode="tel"
          placeholder="+7 (900) 000-00-00"
          pattern="^\+7 \(\d{3}\) \d{3}-\d{2}-\d{2}$"
          required
          >
          <small class="fs-6 text-muted">Формат: +7 (900) 000-00-00</small>
        </div>

        <div class="d-flex flex-column mb-3">
          <label class="form-label" for="order-date">Дата связи</label>
          <input
          class="form-control"
          id="order-date"
          name="date"
          type="date"
          >
        </div>

        <div class="d-flex flex-column mb-3">
          <label class="form-label" for="order-topic">Выберите причину обращения</label>
          <select class="form-control" id="order-topic" name="topic" required>
            <option>Выберите вариант</option>
            <option value="question">Хочу задать вопрос</option>
            <option value="delivery_time">Узнать статус доставки</option>
          </select>
        </div>

        <div class="d-flex flex-column mb-3">
          <label class="form-label" for="order-comment">Комментарий</label>
          <textarea
          class="form-control"
          id="order-comment"
          name="comment"
          rows="4"
          placeholder="Укажите ваш вопрос"
          ></textarea>
        </div>

        <div class="form-check mb-3">
          <label class="form-label">
            <input
                class="form-check-input"
                id="order-agreement"
                name="agreement"
                type="checkbox"
                required
            >
            Я согласен на обработку данных
          </label>
        </div>

        <div>
            <button class="btn btn-primary" type="submit">Отправить заявку</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="bg-primary text-white py-4 mt-5">
    <div class="container">
      <div class="row align-items-center g-3">
        <div class="col-12 col-md-6">
          <p class="mb-0">
            &copy; 2026 Bootstrap Shop. Учебный проект.
          </p>
        </div>

        <div class="col-12 col-md-6 text-md-end">
          <a class="text-dark text-decoration-none me-3" href="catalog.html">
            Каталог
          </a>
          <a class="text-dark text-decoration-none" href="order.html">
            Заявка
          </a>
        </div>
      </div>
    </div>
  </footer>
</body>
</html>
